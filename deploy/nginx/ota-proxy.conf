server {
    listen 80;
    server_name ota.plumeria.sumat.org;

    # Resolver for proxy_pass to upstream hosts
    resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;
    resolver_timeout 5s;

    # On-device OTA update check: relay GitHub's latest-release API over plain
    # HTTP so the firmware never needs TLS. /releases/latest excludes prereleases.
    location = /firmware/latest {
        proxy_set_header Host api.github.com;
        proxy_set_header User-Agent "plumeria-mc-ota-proxy";
        proxy_ssl_server_name on;
        proxy_pass https://api.github.com/repos/oumike/plumeria-mc/releases/latest;

        proxy_http_version 1.1;
        proxy_buffering off;
        default_type application/json;

        add_header Cache-Control "public, max-age=300" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Firmware asset proxy:
    #   /firmware/<tag>/<asset>
    # -> https://github.com/oumike/plumeria-mc/releases/download/<tag>/<asset>
    location ~ ^/firmware/(?<release_path>.+)$ {
        proxy_set_header Host github.com;
        proxy_ssl_server_name on;
        proxy_pass https://github.com/oumike/plumeria-mc/releases/download/$release_path;

        proxy_intercept_errors on;
        proxy_redirect off;
        proxy_buffering off;
        proxy_http_version 1.1;

        # Follow GitHub 30x to release-assets.githubusercontent.com server-side.
        proxy_pass_request_headers on;
        error_page 301 302 307 308 = @firmware_redirect;

        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location @firmware_redirect {
        set $redirect_url $upstream_http_location;
        proxy_set_header Host release-assets.githubusercontent.com;
        proxy_ssl_server_name on;
        proxy_pass $redirect_url;

        proxy_buffering off;
        proxy_http_version 1.1;

        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
    }
}

[platformio]
default_envs = cardputer-cap
boards_dir = boards

[env]
platform  = espressif32@6.7.0
board     = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DESP32_PLATFORM=1
    -DPLUMERIA_STANDALONE=1
    -DENV_INCLUDE_GPS=1
    -DPIN_GPS_RX=43
    -DPIN_GPS_TX=44
    -DGPS_BAUD_RATE=38400
    -DRADIOLIB_STATIC_ONLY=1
    -DRADIOLIB_GODMODE=1
    -DLORA_FREQ=869.618
    -DLORA_BW=62.5
    -DLORA_SF=8
    -DLORA_CR=5
    -DLORA_TX_PWR=22
    -DLORA_TX_POWER=22
    -DLORA_RX_BOOSTED_GAIN=1
    -DMAX_CONTACTS=128
    -DMAX_GROUP_CHANNELS=40
    -DLV_CONF_SKIP=1
    -std=gnu++17
    -Isrc
    -Isrc/config
    -Isrc/hal
    -Isrc/mesh
    -Isrc/ui
    -Ithird_party/MeshCore/lib/ed25519
        -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/SPI/src
    !echo "-DAPP_VERSION=\\\"$(cat VERSION | tr -d '\\n')\\\""

build_unflags =
    -std=gnu++11

lib_deps =
    SPI
    Wire
    stevemarple/MicroNMEA @ ^2.0.6
    symlink://third_party/MeshCore/lib/ed25519
    lvgl/lvgl@8.3.11
    lovyan03/LovyanGFX@^1.2.0
    jgromes/RadioLib@^7.6.0
    rweather/Crypto@^0.4.0
    densaugeo/base64@~1.4.0
    symlink://third_party/MeshCore

[env:tdeck]
board = t-deck
upload_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_size          = 16MB
lib_deps =
    ${env.lib_deps}
build_flags =
    ${env.build_flags}
    -DDEVICE_TDECK=1
    -DLV_FONT_MONTSERRAT_10=1
    -DLV_FONT_MONTSERRAT_12=1
    -DLV_FONT_MONTSERRAT_16=1
    -DLV_MEM_SIZE=65536
    -DP_LORA_SCLK=40
    -DP_LORA_MISO=38
    -DP_LORA_MOSI=41
    -DP_LORA_NSS=9
    -DP_LORA_DIO_1=45
    -DP_LORA_RESET=17
    -DP_LORA_BUSY=13

[env:tlora-pager-tft]
upload_speed = 921600
board_build.arduino.memory_type = qio_qspi
board_build.flash_size          = 16MB
lib_deps =
    ${env.lib_deps}
    https://github.com/pschatzmann/arduino-audio-driver/archive/v0.3.0.zip
build_flags =
    ${env.build_flags}
    -DDEVICE_TLORA_PAGER_TFT=1
    -DLV_FONT_MONTSERRAT_10=1
    -DLV_FONT_MONTSERRAT_12=1
    -DLV_FONT_MONTSERRAT_14=1
    -DLV_FONT_MONTSERRAT_16=1
    -DLV_FONT_MONTSERRAT_18=1
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_MEM_SIZE=65536
    -DBOARD_HAS_PSRAM
    -DP_LORA_SCLK=35
    -DP_LORA_MISO=33
    -DP_LORA_MOSI=34
    -DP_LORA_NSS=36
    -DP_LORA_DIO_1=14
    -DP_LORA_RESET=47
    -DP_LORA_BUSY=48

[env:cardputer-cap]
upload_speed = 1500000
board_build.arduino.memory_type = qio_qspi
board_build.flash_size          = 8MB
build_src_filter =
    +<*>
    -<ota/>
lib_deps =
    SPI
    Wire
    stevemarple/MicroNMEA @ ^2.0.6
    symlink://third_party/MeshCore/lib/ed25519
    lvgl/lvgl@8.3.11
    jgromes/RadioLib@^7.6.0
    rweather/Crypto@^0.4.0
    densaugeo/base64@~1.4.0
    symlink://third_party/MeshCore
    M5Cardputer=https://github.com/m5stack/M5Cardputer
build_flags =
    ${env.build_flags}
    -DDEVICE_CARDPUTER_LORA_HAT=1
    -DPLUMERIA_OTA_ENABLED=0
    -DLV_FONT_MONTSERRAT_8=1
    -DP_LORA_SCLK=40
    -DP_LORA_MISO=39
    -DP_LORA_MOSI=14
    -DP_LORA_NSS=5
    -DP_LORA_DIO_1=4
    -DP_LORA_RESET=3
    -DP_LORA_BUSY=6


[platformio]
default_envs = tdeck
boards_dir = boards

[env]
platform  = espressif32@6.7.0
board     = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DESP32_PLATFORM=1
    -DPLUMERIA_STANDALONE=1
    -DRADIOLIB_STATIC_ONLY=1
    -DRADIOLIB_GODMODE=1
    -DLORA_FREQ=869.618
    -DLORA_BW=62.5
    -DLORA_SF=8
    -DLORA_CR=5
    -DLORA_TX_PWR=22
    -DLORA_TX_POWER=22
    -DLORA_RX_BOOSTED_GAIN=1
    -DMAX_CONTACTS=128
    -DMAX_GROUP_CHANNELS=40
    -DLV_CONF_SKIP=1
    -std=gnu++17
    -Isrc
    -Isrc/config
    -Isrc/hal
    -Isrc/mesh
    -Isrc/ui
        -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/SPI/src
    !echo "-DAPP_VERSION=\\\"$(cat VERSION | tr -d '\\n')\\\""

build_unflags =
    -std=gnu++11

lib_deps =
    SPI
    Wire
    file://third_party/MeshCore/lib/ed25519
    lvgl/lvgl@8.3.11
    lovyan03/LovyanGFX@^1.2.0
    jgromes/RadioLib@^7.6.0
    rweather/Crypto@^0.4.0
    densaugeo/base64@~1.4.0
    file://third_party/MeshCore

[env:tdeck]
board = t-deck
upload_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_size          = 16MB
lib_deps =
    ${env.lib_deps}
    stevemarple/MicroNMEA @ ^2.0.6
build_flags =
    ${env.build_flags}
    -DDEVICE_TDECK=1
    -DLV_FONT_MONTSERRAT_10=1
    -DENV_INCLUDE_GPS=1
    -DPIN_GPS_RX=43
    -DPIN_GPS_TX=44
    -DGPS_BAUD_RATE=38400
    -DP_LORA_SCLK=40
    -DP_LORA_MISO=38
    -DP_LORA_MOSI=41
    -DP_LORA_NSS=9
    -DP_LORA_DIO_1=45
    -DP_LORA_RESET=17
    -DP_LORA_BUSY=13

[env:tlora-pager-tft]
upload_speed = 921600
board_build.arduino.memory_type = qio_qspi
board_build.flash_size          = 16MB
build_flags =
    ${env.build_flags}
    -DDEVICE_TLORA_PAGER_TFT=1
    -DP_LORA_SCLK=35
    -DP_LORA_MISO=33
    -DP_LORA_MOSI=34
    -DP_LORA_NSS=36
    -DP_LORA_DIO_1=14
    -DP_LORA_RESET=47
    -DP_LORA_BUSY=48

[env:cardputer-cap]
upload_speed = 1500000
board_build.arduino.memory_type = qio_qspi
board_build.flash_size          = 8MB
build_flags =
    ${env.build_flags}
    -DDEVICE_CARDPUTER_LORA_HAT=1

[env:heltec-v4]
upload_speed = 921600
board_build.arduino.memory_type = qio_qspi
board_build.flash_size          = 16MB
lib_deps =
    ${env.lib_deps}
    https://github.com/Quency-D/chsc6x/archive/5cbead829d6b432a8d621ed1aafd4eb474fd4f27.zip
build_flags =
    ${env.build_flags}
    -DDEVICE_HELTEC_V4_EXPANSION=1
    -DP_LORA_SCLK=9
    -DP_LORA_MISO=11
    -DP_LORA_MOSI=10
    -DP_LORA_NSS=8
    -DP_LORA_DIO_1=14
    -DP_LORA_RESET=12
    -DP_LORA_BUSY=13

[env:heltec-v4-vertical]
upload_speed = 921600
board_build.arduino.memory_type = qio_qspi
board_build.flash_size          = 16MB
lib_deps =
    ${env.lib_deps}
    https://github.com/Quency-D/chsc6x/archive/5cbead829d6b432a8d621ed1aafd4eb474fd4f27.zip
build_flags =
    ${env.build_flags}
    -DDEVICE_HELTEC_V4_EXPANSION=1
    -DDEVICE_UI_VERTICAL=1
    -DHELTEC_COMPACT_SELECTOR=1
    -DP_LORA_SCLK=9
    -DP_LORA_MISO=11
    -DP_LORA_MOSI=10
    -DP_LORA_NSS=8
    -DP_LORA_DIO_1=14
    -DP_LORA_RESET=12
    -DP_LORA_BUSY=13
